<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="淡蘭紀錄">
<title>淡蘭走訪紀錄</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/home">淡蘭走訪紀錄</a>
  <button class="status" id="statusBtn" aria-label="同步狀態">
    <span class="dot" id="netDot"></span><span id="statusText">—</span>
  </button>
  <a class="iconbtn" href="#/settings" aria-label="設定">⚙︎</a>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="主選單">
  <a href="#/home" data-tab="home"><span class="ti">🏠</span><span>首頁</span></a>
  <a href="#/routes" data-tab="routes"><span class="ti">🥾</span><span>路段</span></a>
  <a href="#/map" data-tab="map"><span class="ti">🗺️</span><span>地圖</span></a>
  <a href="#/add" data-tab="add"><span class="ti">➕</span><span>補登</span></a>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
